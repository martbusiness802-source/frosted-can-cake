<style>
:root{--burgundy:#5c0b17;--gold:#d9a54a;--gold-2:#f1cf86;--cream:#fbf3e4}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--burgundy);color:var(--cream);font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.mono{width:76px;height:76px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8a1a2b,#4a0812);border:1.5px solid var(--gold)}
.mono img{width:64%;height:auto}
h1{font-family:"Playfair Display",serif;font-weight:900;font-size:clamp(34px,7vw,64px);line-height:1.02;background:linear-gradient(180deg,#f6d79a 0%,#d9a54a 45%,#9c6a22 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:14px;font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(18px,2.4vw,24px);color:var(--gold-2)}
a{display:inline-block;margin-top:30px;text-decoration:none;font-weight:700;font-size:16px;padding:15px 26px;border-radius:999px;background:var(--gold);color:var(--burgundy)}
a:focus-visible{outline:3px solid var(--gold-2);outline-offset:3px}
</style>
</head>
<body>
<main>

  <h1>Page introuvable</h1>
